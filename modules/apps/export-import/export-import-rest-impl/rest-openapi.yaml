        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: ""
    version: v1.0
openapi: 3.0.1
paths:
    "/asset-libraries/{assetLibraryExternalReferenceCode}/export-preview":
        get:
            operationId: getAssetLibraryExportPreview
            parameters:
                -   in: path
                    name: assetLibraryExternalReferenceCode
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: endDate
                    schema:
                        format: date-time
                        type: string
                -   in: query
                    name: last
                    schema:
                        format: int32
                        type: integer
                -   in: query
                    name: range
                    schema:
                        default: all
                        enum: [all, dateRange, last]
                        type: string
                -   in: query
                    name: startDate
                    schema:
                        format: date-time
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ExportPreview"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/ExportPreview"
            tags: ["ExportPreview"]
    "/asset-libraries/{assetLibraryExternalReferenceCode}/export-processes":
        post:
            description:
                Creates and starts an export that runs asynchronously. The response returns immediately with an export
                process whose status is New. Poll the export process by its id until the status reaches a terminal code
                (see the Status schema). The generated LAR can then be imported by passing the process's id as the
                exportProcessId of an import request.
            operationId: postAssetLibraryExportProcess
            parameters:
                -   in: path
                    name: assetLibraryExternalReferenceCode
                    required: true
                    schema:
                        type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ExportProcessRequest"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/ExportProcessRequest"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ExportProcess"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/ExportProcess"
            tags: ["ExportProcess"]
    "/asset-libraries/{assetLibraryExternalReferenceCode}/import-preview":
        post:
            operationId: postAssetLibraryImportPreview
            parameters:
                -   in: path
                    name: assetLibraryExternalReferenceCode
                    required: true
                    schema:
                        type: string
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            properties:
                                file:
                                    format: binary
                                    type: string
                            type: object
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ImportPreview"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/ImportPreview"
            tags: ["ImportPreview"]
    "/asset-libraries/{assetLibraryExternalReferenceCode}/import-processes":
        post:
            description:
                Creates and starts an import that runs asynchronously. The response returns immediately with an import
                process whose status is New. Poll the import process by its id until the status reaches a terminal code
                (see the Status schema), then read its report entries to review any unresolved references.
            operationId: postAssetLibraryImportProcess
            parameters:
                -   in: path
                    name: assetLibraryExternalReferenceCode
                    required: true
                    schema:
                        type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ImportProcessRequest"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/ImportProcessRequest"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ImportProcess"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/ImportProcess"
            tags: ["ImportProcess"]
    "/asset-libraries/{assetLibraryId}/export-processes":
        description:
            Retrieves the export process entries for the specified asset library.
        get:
            operationId: getAssetLibraryExportProcessesPage
            parameters:
                -   in: path
                    name: assetLibraryId
                    required: true
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    name: creatorId
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    name: fields
                    schema:
                        type: string
                -   in: query
                    name: nestedFields
                    schema:
                        type: string
                -   in: query
                    name: page
                    schema:
                        type: integer
                -   in: query
                    name: pageSize
                    schema:
                        type: integer
                -   in: query
                    name: restrictFields
                    schema:
                        type: string
                -   in: query
                    name: search
                    schema:
                        type: string
                -   in: query
                    name: sort
                    schema:
                        type: string
                -   in: query
                    name: status
                    schema:
                        type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/ExportProcess"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/ExportProcess"
                                type: array
            tags: ["ExportProcess"]
